<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Amredi | Email confirmation</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#fff8f8;color:#392332;display:grid;min-height:100vh;place-items:center}.card{box-sizing:border-box;background:white;border:1px solid #f0dfe4;border-radius:24px;padding:36px;max-width:440px;margin:24px;box-shadow:0 16px 48px #70294712}.brand{color:#bd5175;font-weight:750;letter-spacing:.05em}h1{font-size:28px;line-height:1.2}p{line-height:1.6;color:#6e5865}a{display:inline-block;background:#b8456c;color:white;text-decoration:none;border-radius:14px;padding:14px 22px;font-weight:700}</style></head><body><main class="card"><div class="brand">AMREDI</div><h1 id="title">Confirm your email</h1><p id="message">Open the confirmation link in your email to continue.</p><a href="amredi://auth">Open Amredi</a></main><script>const p=new URLSearchParams(location.hash.slice(1));const error=p.get('error');const success=p.has('access_token')&&p.has('refresh_token')&&p.get('type')==='signup';history.replaceState(null,'',location.pathname);if(error){document.getElementById('title').textContent='This link could not be confirmed';document.getElementById('message').textContent='The link may have expired or already been used. Open Amredi and try signing in or request a new confirmation email.'}else if(success){document.getElementById('title').textContent='Return to Amredi';document.getElementById('message').textContent='Sign in with your email and password. If your email has not been confirmed, request another confirmation link.'}</script></body></html>
